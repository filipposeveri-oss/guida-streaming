name: Aggiorna cataloghi

on:
  schedule:
    - cron: "17 2 * * *"   # ogni notte alle 02:17 UTC (04:17 in Italia d'estate)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/index.html", "src/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna-cataloghi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Scarica cataloghi e voti
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          PROVIDERS: ${{ vars.PROVIDERS }}
        run: node src/sync.js

      - name: Salva la cache dei voti nel repository
        # Se il salvataggio non riesce, il sito viene pubblicato lo stesso
        continue-on-error: true
        run: |
          git config user.name "guida-streaming-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ratings.json
          if git diff --cached --quiet; then echo "Cache invariata"; exit 0; fi
          git commit -m "Aggiorna cache voti $(date -u +%F)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Pubblicazione in un job separato: l'archivio del sito è già registrato quando deploy-pages lo cerca.
  # Se GitHub non lo trova comunque, riprova dopo un minuto e poi dopo tre.
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy2.outcome == 'failure'
        run: sleep 180
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
